<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live News Quad Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100vw;
            height: 100vh;
            background: #000;
            gap: 4px;
            padding: 4px;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
        }
        /* Fullscreen button overlay style */
        #fs-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            cursor: pointer;
        }
        #fs-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <button id="fs-btn" onclick="toggleFullScreen()">Go Full Screen</button>

    <div class="grid-container" id="grid">
        <!-- Top-Left: Bloomberg Business News -->
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/QB5BNdBFujE?autoplay=1&mute=1&controls=0&playsinline=1&enablejsapi=1" 
                    title="Bloomberg Business News Live" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen></iframe>
        </div>
        
        <!-- Top-Right: CNN Headlines -->
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/GotlA1KKWoo?autoplay=1&mute=1&controls=0&playsinline=1&enablejsapi=1" 
                    title="CNN Headlines: 24/7 Live News" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen></iframe>
        </div>
        
        <!-- Bottom-Left: Al Jazeera English Live -->
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/gCNeDWCI0vo?autoplay=1&mute=1&controls=0&playsinline=1&enablejsapi=1" 
                    title="Al Jazeera English Live" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen></iframe>
        </div>
        
        <!-- Bottom-Right: ABC News Live -->
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/KQhNZQ_Uag8?autoplay=1&mute=1&controls=0&playsinline=1&enablejsapi=1" 
                    title="ABC News Live" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function toggleFullScreen() {
            let elem = document.documentElement;
            let btn = document.getElementById("fs-btn");
            
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari/iOS */
                    elem.webkitRequestFullscreen();
                }
                btn.style.display = "none"; // Hide button once in full screen
            }
        }
    </script>
</body>
</html>
